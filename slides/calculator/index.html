<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATH 117 · Calculator</title>
<link rel="stylesheet" href="../lib/fonts/montserrat/montserrat.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #eef6f4;
    color: #1c242c;
    font-family: Montserrat, sans-serif;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 28px 96px;
  }
  a { color: #2a6f7a; }
  .badge {
    display: inline-block;
    background: #2a6f7a;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 6px 12px;
    text-decoration: none;
  }
  h1 {
    margin: 22px 0 0;
    font-size: 48px;
    line-height: 1;
    letter-spacing: -0.04em;
    font-weight: 700;
  }
  .lead, .note {
    margin: 14px 0 0;
    max-width: 720px;
    color: #5d6670;
    font-size: 17px;
    line-height: 1.45;
  }
  .field {
    display: block;
    margin: 22px 0 8px;
    font-size: 15px;
    font-weight: 700;
  }
  textarea, input {
    width: 100%;
    border: 1.5px solid #e4e1da;
    border-radius: 14px;
    padding: 14px 16px;
    font-family: Montserrat, sans-serif;
    font-size: 16px;
    color: #1c242c;
    background: #fff;
  }
  textarea { min-height: 140px; resize: vertical; }
  .check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.4;
  }
  .check input { width: auto; margin-top: 3px; }
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .choices button {
    border: 1.5px solid #e4e1da;
    background: #fff;
    color: #1c242c;
    border-radius: 999px;
    padding: 10px 16px;
    font: inherit;
    font-size: 15px;
    font-weight: 650;
    cursor: pointer;
  }
  .choices button[aria-pressed="true"] {
    background: #2a6f7a;
    border-color: #2a6f7a;
    color: #fff;
  }
  .opt { max-width: 360px; }
  [hidden] { display: none !important; }
  .chart {
    width: 100%;
    height: auto;
    display: block;
    margin-top: 12px;
    background: #fff;
    border: 1px solid #e4e1da;
    border-radius: 14px;
  }
  .row input { max-width: 100%; }
  h2 {
    margin: 36px 0 0;
    color: #2a6f7a;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .hint, .ordered {
    margin: 10px 0 0;
    color: #5d6670;
    font-size: 16px;
    line-height: 1.45;
  }
  .ordered { color: #1c242c; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }
  .stat, .panel {
    background: #fff;
    border: 1px solid #e4e1da;
    border-radius: 14px;
    padding: 14px 16px;
  }
  .stat.wide, .panel { grid-column: 1 / -1; }
  .k {
    margin: 0;
    color: #2a6f7a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .plain {
    text-transform: none;
    letter-spacing: 0;
  }
  .v {
    margin: 6px 0 0;
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }
  .r {
    margin: 4px 0 0;
    color: #5d6670;
    font-size: 14px;
    line-height: 1.4;
  }
  .wrap { overflow-x: auto; margin-top: 12px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid #e4e1da;
    border-radius: 14px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid #e4e1da;
    font-size: 16px;
  }
  th {
    color: #2a6f7a;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  tr:last-child td { border-bottom: 0; }
  @media (max-width: 720px) {
    h1 { font-size: 36px; }
    .stats { grid-template-columns: 1fr; }
    main { padding: 32px 18px 72px; }
  }
</style>
</head>
<body>
<main>
  <p><a class="badge" href="../">MATH 117</a></p>
  <h1>Calculator</h1>
  <p class="lead">Chapters 1 and 2. Say how many columns the book gives you, paste them, then choose one thing.</p>
  <p class="field" id="shape-label">How many columns?</p>
  <div class="choices" id="shapes" role="group" aria-labelledby="shape-label">
    <button type="button" data-shape="one" aria-pressed="true">One column</button>
    <button type="button" data-shape="two" aria-pressed="false">Two columns</button>
    <button type="button" data-shape="three" aria-pressed="false">Three columns</button>
  </div>
  <p class="hint" id="shape-hint">One column. Each answer is one value. A name can go on the first line.</p>
  <label class="field" for="data">The data</label>
  <textarea id="data" spellcheck="false" placeholder="Hours&#10;5, 6, 3, 3, 2"></textarea>
  <p class="field" id="want-label">What do you want?</p>
  <div class="choices" id="wants" role="group" aria-labelledby="want-label">
    <button type="button" data-pick="table" aria-pressed="false">Frequency table</button>
    <button type="button" data-pick="bar" aria-pressed="false">Bar graph</button>
    <button type="button" data-pick="hist" aria-pressed="false">Histogram</button>
    <button type="button" data-pick="center" aria-pressed="false">Center</button>
    <button type="button" data-pick="quartiles" aria-pressed="false">Quartiles</button>
    <button type="button" data-pick="sd" aria-pressed="false">Standard deviation</button>
    <button type="button" data-pick="percentile" aria-pressed="false">Percentile</button>
  </div>
  <div class="opt" id="opt-bars" hidden>
    <label class="field" for="bars">How many bars</label>
    <input id="bars" inputmode="numeric" placeholder="5 to 15">
  </div>
  <div class="opt" id="opt-k" hidden>
    <label class="field" for="k">How many standard deviations from the mean</label>
    <input id="k" inputmode="decimal" placeholder="1 or −2">
  </div>
  <div class="opt" id="opt-pct" hidden>
    <label class="field" for="pct">Which percentile</label>
    <input id="pct" inputmode="decimal" placeholder="70">
  </div>
  <div id="out" aria-live="polite"></div>
</main>
<script>
(function () {
  var dataBox = document.getElementById("data");
  var pctBox = document.getElementById("pct");
  var kBox = document.getElementById("k");
  var barsBox = document.getElementById("bars");
  var out = document.getElementById("out");
  var shapeHint = document.getElementById("shape-hint");
  var pick = "";
  var shape = "one";
  var shapeText = {
    one: "One column. Each answer is one value. A name can go on the first line.",
    two: "Two columns. Each line is the value, then how many. The first line can be the names.",
    three: "Three columns. Each line is where the bar starts, where it ends, then how many. The first line can be the names."
  };
  var shapePlaceholder = {
    one: "Hours\n5, 6, 3, 3, 2",
    two: "Hours  Frequency\n2  3\n3  5\n4  3",
    three: "Start  End  Frequency\n59.95  61.95  5\n61.95  63.95  3"
  };

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
    });
  }

  function cleanToken(token) {
    return token.replace(/\u2212/g, "-").replace(/\$/g, "").trim();
  }

  function toNumber(token) {
    var t = cleanToken(token).replace(/,/g, "");
    if (!/^[-+]?\d*\.?\d+$/.test(t)) return null;
    return Number(t);
  }

  function decimalsIn(token) {
    var t = cleanToken(token).replace(/,/g, "");
    var dot = t.indexOf(".");
    return dot === -1 ? 0 : t.length - dot - 1;
  }

  function plainTokens(text) {
    return text.replace(/\u2212/g, "-").replace(/\$/g, "").split(/[\n;\s]+/).flatMap(function (chunk) {
      if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(chunk)) return [chunk.replace(/,/g, "")];
      return chunk.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    });
  }

  function shortNum(x) {
    var s = x.toFixed(6).replace(/\.?0+$/, "");
    return s === "-0" ? "0" : s;
  }

  function blankHeaders() {
    return { value: "Value", frequency: "Frequency", relative: "Relative", percent: "Percent", cumulative: "Cumulative" };
  }

  function splitSmart(line) {
    var raw = line.trim();
    if (raw.indexOf("\t") !== -1) return { sep: "tab", fields: raw.split(/\t+/).map(function (s) { return s.trim(); }).filter(Boolean) };
    if (raw.indexOf(",") !== -1) return { sep: "comma", fields: raw.split(",").map(function (s) { return s.trim(); }).filter(Boolean) };
    if (/\s{2,}/.test(raw)) return { sep: "gap", fields: raw.split(/\s{2,}/).map(function (s) { return s.trim(); }).filter(Boolean) };
    return { sep: "space", fields: raw.split(/\s+/).filter(Boolean) };
  }

  function isTwoData(line) {
    var cleaned = line.replace(/\u2212/g, "-").replace(/\$/g, "");
    var pair = cleaned.match(/^(\d{1,3}(?:,\d{3})+(?:\.\d+)?)[\s]+(\d+)$/) ||
      cleaned.match(/^(.+?)[\s,;]+(\d+(?:\.\d+)?%?)$/);
    if (!pair) return false;
    if (/[\s,]/.test(pair[1].trim()) && !/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(pair[1].trim())) return false;
    return Number(pair[2].replace(/%$/, "")) > 0;
  }

  function isThreeData(line) {
    var bits = line.replace(/\u2212/g, "-").replace(/\$/g, "").split(/[\s,;]+/).filter(Boolean);
    if (bits.length !== 3) return false;
    var start = toNumber(bits[0]);
    var end = toNumber(bits[1]);
    var count = Number(bits[2].replace(/%$/, ""));
    return start !== null && end !== null && end > start && count > 0;
  }

  function nameHeaders(line, shape) {
    var headers = blankHeaders();
    var parts = splitSmart(line);
    var fields = parts.fields;
    if (!fields.length) return headers;
    if (shape === "one") {
      headers.value = line.trim();
      return headers;
    }
    if (shape === "two" && parts.sep === "space" && fields.length > 2) {
      headers.frequency = fields[fields.length - 1];
      headers.value = fields.slice(0, -1).join(" ");
      return headers;
    }
    if (shape === "three") {
      if (fields.length >= 3) {
        headers.value = fields[0] + "–" + fields[1];
        headers.frequency = fields[2];
      } else headers.value = fields.join(" ");
      return headers;
    }
    headers.value = fields[0];
    if (fields.length >= 2) headers.frequency = fields[1];
    if (fields.length >= 3) headers.relative = fields[2];
    if (fields.length === 4) headers.cumulative = fields[3];
    if (fields.length >= 5) {
      headers.percent = fields[3];
      headers.cumulative = fields[4];
    }
    return headers;
  }

  function peelHeader(text, shape) {
    var lines = text.split(/\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    if (lines.length < 2) return { text: text, headers: blankHeaders() };
    if (shape === "one") {
      var restTokens = plainTokens(lines.slice(1).join("\n"));
      var restNumeric = restTokens.length > 0 && restTokens.every(function (token) { return toNumber(token) !== null; });
      var firstWords = lines[0].trim().split(/\s+/);
      var named = (!restNumeric && !/\d/.test(lines[0]) && firstWords.length >= 2 && lines[0].indexOf(",") === -1) ||
        (restNumeric && !/\d/.test(lines[0]));
      if (!named) return { text: text, headers: blankHeaders() };
      return { text: lines.slice(1).join("\n"), headers: nameHeaders(lines[0], shape) };
    }
    var dataLine = shape === "three" ? isThreeData : isTwoData;
    if (!dataLine(lines[0]) && dataLine(lines[1])) {
      return { text: lines.slice(1).join("\n"), headers: nameHeaders(lines[0], shape) };
    }
    return { text: text, headers: blankHeaders() };
  }

  function parse(text, shape) {
    if (!text.trim()) return { empty: true };
    var peeled = peelHeader(text, shape);
    text = peeled.text;
    var headers = peeled.headers;
    if (!text.trim()) return { error: "Put the rows under the names." };
    var rows = [];
    var places = 0;
    var numeric = true;
    if (shape === "three") {
      var lines3 = text.split(/\n/).map(function (l) { return l.trim(); }).filter(Boolean);
      for (var t = 0; t < lines3.length; t++) {
        var bits = lines3[t].replace(/\u2212/g, "-").replace(/\$/g, "").split(/[\s,;]+/).filter(Boolean);
        if (bits.length !== 3) return { error: "Each line needs a start, an end, and a count. Example: 59.95  61.95  5" };
        var start = toNumber(bits[0]);
        var end = toNumber(bits[1]);
        var count = Number(bits[2].replace(/%$/, ""));
        if (start === null || end === null || !(end > start) || !(count > 0)) {
          return { error: "Each line needs a start, an end after it, and a count." };
        }
        places = Math.max(places, decimalsIn(bits[0]), decimalsIn(bits[1]));
        rows.push({ label: shortNum(start) + "–" + shortNum(end), x: null, f: count, left: start, right: end });
      }
      numeric = false;
    } else if (shape === "one") {
      var tokens = plainTokens(text);
      if (!tokens.length) return { empty: true };
      for (var i = 0; i < tokens.length; i++) {
        var value = toNumber(tokens[i]);
        if (value === null) numeric = false;
        else places = Math.max(places, decimalsIn(tokens[i]));
        rows.push({ label: cleanToken(tokens[i]).replace(/,/g, ""), x: value, f: 1 });
      }
    } else {
      var lines = text.split(/\n/).map(function (l) { return l.trim(); }).filter(Boolean);
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j].replace(/\u2212/g, "-").replace(/\$/g, "");
        var pair = line.match(/^(\d{1,3}(?:,\d{3})+(?:\.\d+)?)[\s]+(\d+)$/) ||
          line.match(/^(.+?)[\s,;]+(\d+(?:\.\d+)?%?)$/);
        if (!pair || (/[\s,]/.test(pair[1].trim()) && !/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(pair[1].trim()))) {
          return { error: "Each line needs a value and a count, such as 9.5 2." };
        }
        var rawCount = pair[2].replace(/%$/, "");
        var label = pair[1].trim().replace(/,/g, "");
        var x = toNumber(label);
        var count = Number(rawCount);
        if (x !== null) {
          if (!/^\d+$/.test(rawCount) || count < 1) {
            return { error: "A count has to be a whole number, 1 or more." };
          }
          places = Math.max(places, decimalsIn(label));
        } else if (!(count > 0)) {
          return { error: "A bar height has to be a number greater than 0." };
        } else numeric = false;
        rows.push({ label: label, x: x, f: count });
      }
    }
    var n = rows.reduce(function (sum, row) { return sum + row.f; }, 0);
    if (n > 20000) return { error: "That list is too long for this page." };
    return { rows: rows, n: n, places: places, numeric: numeric, grouped: shape === "three", headers: headers };
  }

  function medianOf(sorted) {
    var n = sorted.length;
    if (!n) return null;
    if (n % 2 === 1) return sorted[(n - 1) / 2];
    return (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
  }

  function summarize(rows) {
    var n = rows.reduce(function (sum, row) { return sum + row.f; }, 0);
    var total = rows.reduce(function (sum, row) { return sum + row.f * row.x; }, 0);
    var mean = total / n;
    var ss = rows.reduce(function (sum, row) {
      var d = row.x - mean;
      return sum + row.f * d * d;
    }, 0);
    var expanded = [];
    rows.forEach(function (row) {
      for (var i = 0; i < row.f; i++) expanded.push(row.x);
    });
    expanded.sort(function (a, b) { return a - b; });
    var med = medianOf(expanded);
    var lower, upper;
    if (n % 2 === 1) {
      lower = expanded.slice(0, (n - 1) / 2);
      upper = expanded.slice((n + 1) / 2);
    } else {
      lower = expanded.slice(0, n / 2);
      upper = expanded.slice(n / 2);
    }
    var q1 = medianOf(lower);
    var q3 = medianOf(upper);
    return {
      n: n,
      mean: mean,
      median: med,
      s: n > 1 ? Math.sqrt(ss / (n - 1)) : null,
      sigma: Math.sqrt(ss / n),
      min: expanded[0],
      q1: q1,
      q3: q3,
      max: expanded[n - 1],
      iqr: q1 === null || q3 === null ? null : q3 - q1,
      sorted: expanded
    };
  }

  function withCommas(s) {
    var neg = s.charAt(0) === "-";
    var body = neg ? s.slice(1) : s;
    var parts = body.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + parts.join(".");
  }

  function unrounded(x) {
    if (x === null || !isFinite(x)) return "—";
    var s = x.toFixed(6).replace(/\.?0+$/, "");
    if (s === "-0") s = "0";
    return withCommas(s);
  }

  function rounded(x, places) {
    if (x === null || !isFinite(x)) return "—";
    return withCommas(x.toFixed(places));
  }

  function share(f, n, last) {
    if (last) return "1.00";
    var s = (f / n).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
    if (s.indexOf(".") === -1) return s + ".00";
    if (s.split(".")[1].length === 1) return s + "0";
    return s;
  }

  function percent(f, n) {
    var s = (f / n * 100).toFixed(1).replace(/\.0$/, "");
    return s + "%";
  }

  function groupsOf(rows, numeric) {
    var map = [];
    var index = {};
    rows.forEach(function (row) {
      var key = numeric ? String(row.x) : row.label;
      if (index[key] === undefined) {
        index[key] = map.length;
        map.push({
          key: key, x: row.x, label: numeric ? unrounded(row.x) : row.label, f: 0,
          left: row.left, right: row.right
        });
      }
      map[index[key]].f += row.f;
    });
    if (numeric) map.sort(function (a, b) { return a.x - b.x; });
    return map;
  }

  function table(groups, n, headers) {
    var h = headers || blankHeaders();
    var cumF = 0;
    var body = groups.map(function (g, i) {
      cumF += g.f;
      var last = i === groups.length - 1;
      return "<tr><td>" + esc(g.label) + "</td><td>" + g.f + "</td><td>" +
        share(g.f, n, false) + "</td><td>" + percent(g.f, n) + "</td><td>" +
        share(cumF, n, last) + "</td></tr>";
    }).join("");
    return '<div class="wrap"><table><thead><tr><th>' + esc(h.value) + "</th><th>" + esc(h.frequency) +
      "</th><th>" + esc(h.relative) + "</th><th>" + esc(h.percent) + "</th><th>" + esc(h.cumulative) +
      "</th></tr></thead><tbody>" + body + "</tbody></table></div>";
  }

  function stat(label, value, places, note) {
    return '<div class="stat"><p class="k">' + label + '</p><p class="v">' + esc(unrounded(value)) +
      '</p><p class="r">' + (note || ("Rounded " + esc(rounded(value, places)))) + "</p></div>";
  }

  function modes(groups) {
    var most = 0;
    groups.forEach(function (g) { if (g.f > most) most = g.f; });
    if (most < 2) return { text: "No value is repeated", note: "Every value appears once." };
    var found = groups.filter(function (g) { return g.f === most; });
    var names = found.map(function (g) { return g.label; }).join(", ");
    var whole = groups.every(function (g) { return Math.abs(g.f - Math.round(g.f)) < 1e-9; });
    var note;
    if (!whole) note = found.length > 1 ? "These are the largest bar heights." : "This is the largest bar height.";
    else if (found.length === 2) note = "Two modes. Each appears " + most + " times.";
    else if (found.length > 2) note = "Each appears " + most + " times.";
    else note = "Appears " + most + " times.";
    return { text: names, note: note };
  }

  function fillBins(sorted, start, width, bars) {
    var counts = [];
    for (var i = 0; i < bars; i++) counts.push(0);
    sorted.forEach(function (x) {
      var i = Math.floor((x - start) / width + 1e-8);
      if (i < 0) i = 0;
      if (i >= bars) i = bars - 1;
      counts[i] += 1;
    });
    return counts;
  }

  function hitsBoundary(sorted, start, width, bars) {
    for (var j = 0; j < sorted.length; j++) {
      var pos = (sorted[j] - start) / width;
      var nearest = Math.round(pos);
      if (nearest >= 1 && nearest <= bars - 1 && Math.abs(pos - nearest) < 1e-6) return true;
    }
    return false;
  }

  function roundUpNice(x) {
    var exp = Math.floor(Math.log10(x));
    var base = Math.pow(10, exp);
    var frac = x / base;
    var nice = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < nice.length; i++) {
      if (frac < nice[i] - 1e-8) return nice[i] * base;
    }
    return 10 * base;
  }

  function planHistogram(sorted, places, barsRaw) {
    var min = sorted[0];
    var max = sorted[sorted.length - 1];
    var asked = null;
    if (barsRaw) {
      if (!/^\d+$/.test(barsRaw) || Number(barsRaw) < 1 || Number(barsRaw) > 30) {
        return { error: "Use 1 to 30 bars." };
      }
      asked = Number(barsRaw);
    }
    var span = max - min;
    if (asked === null && places === 0 && span <= 14 && Math.abs(span - Math.round(span)) < 1e-8) {
      var bars = Math.round(span) + 1;
      var start = min - 0.5;
      var counts = fillBins(sorted, start, 1, bars);
      return {
        bins: counts.map(function (f, i) {
          var left = start + i;
          return { label: unrounded(left + 0.5), f: f, left: left, right: left + 1 };
        }),
        note: "Each whole number has its own bar, and the bars touch. The bar for " +
          unrounded(min) + " runs from " + unrounded(start) + " to " + unrounded(start + 1) + "."
      };
    }
    var bars = asked || Math.min(15, Math.max(5, Math.round(Math.sqrt(sorted.length))));
    var step = 5 * Math.pow(10, -(places + 1));
    var start = min - step;
    var end = max + step;
    var raw = (end - start) / bars;
    var width = raw;
    var guard = 0;
    while (hitsBoundary(sorted, start, width, bars) && guard < 6) {
      width = roundUpNice(width * (1 + 1e-6));
      guard += 1;
    }
    var counts = fillBins(sorted, start, width, bars);
    var note = "Start at " + unrounded(start) + ". Width (" + unrounded(end) + " − " + unrounded(start) + ") / " +
      bars + " = " + unrounded(raw);
    if (Math.abs(width - raw) > 1e-6) note += ", rounded up to " + unrounded(width);
    note += ". A value on the right edge goes in the next bar.";
    if (!asked) note += " Type another number of bars to change the picture.";
    return {
      bins: counts.map(function (f, i) {
        var left = start + i * width;
        return {
          label: unrounded(left),
          edge: true,
          rightLabel: i === bars - 1 ? unrounded(left + width) : "",
          f: f,
          left: left,
          right: left + width
        };
      }),
      note: note
    };
  }

  function chartSvg(items, touching) {
    var n = items.length;
    var slot = 72;
    var W = Math.max(640, n * slot + 80);
    var rotate = items.some(function (it) { return String(it.label).length > 6; }) || n > 12;
    var bottom = rotate ? 96 : 58;
    var top = 46;
    var H = 320;
    var left = 48;
    var right = 48;
    var plotW = W - left - right;
    var plotH = H - top - bottom;
    var vmax = 0;
    items.forEach(function (it) { if (it.f > vmax) vmax = it.f; });
    if (!vmax) vmax = 1;
    var gap = touching ? 0 : plotW / n * 0.34;
    var bw = plotW / n - gap;
    var scaled = touching && items.every(function (it) {
      return typeof it.left === "number" && typeof it.right === "number" && it.right > it.left;
    });
    var x0 = scaled ? items[0].left : 0;
    var x1 = scaled ? items[n - 1].right : 1;
    var span = x1 - x0 || 1;
    function X(v) { return left + (v - x0) / span * plotW; }
    var parts = [
      '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"></rect>',
      '<line x1="' + left + '" y1="' + (top + plotH) + '" x2="' + (W - right) + '" y2="' + (top + plotH) + '" stroke="#d5e0de" stroke-width="1.4"></line>'
    ];
    var lastEdge = "";
    items.forEach(function (it, i) {
      var h = it.f / vmax * (plotH - 22);
      if (it.f > 0) h = Math.max(h, 1);
      var x = scaled ? X(it.left) : left + i * (plotW / n) + (touching ? 0 : gap / 2);
      var barW = scaled ? Math.max(X(it.right) - X(it.left), 1) : bw;
      var y = top + plotH - h;
      var width = touching ? barW + 0.6 : barW;
      parts.push('<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + width.toFixed(2) + '" height="' + h.toFixed(2) + '" fill="#5aa8b4"></rect>');
      parts.push('<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (y - 8).toFixed(1) + '" text-anchor="middle" font-size="13" fill="#1c242c" font-family="Montserrat, sans-serif" font-weight="700">' + esc(unrounded(it.f)) + '</text>');
      var lx = touching ? x : x + barW / 2;
      var ly = top + plotH + 20;
      if (it.rightLabel) lastEdge = it.rightLabel;
      if (rotate) {
        parts.push('<text x="0" y="0" text-anchor="end" font-size="12" fill="#5d6670" font-family="Montserrat, sans-serif" transform="translate(' + lx.toFixed(1) + ' ' + (ly + 4).toFixed(1) + ') rotate(-40)">' + esc(it.label) + '</text>');
      } else {
        parts.push('<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" font-size="13" fill="#5d6670" font-family="Montserrat, sans-serif">' + esc(it.label) + '</text>');
      }
    });
    if (lastEdge) {
      var endX = scaled ? X(items[n - 1].right) : left + plotW;
      parts.push('<text x="' + endX.toFixed(1) + '" y="' + (top + plotH + 20).toFixed(1) + '" text-anchor="middle" font-size="13" fill="#5d6670" font-family="Montserrat, sans-serif">' + esc(lastEdge) + '</text>');
    }
    return '<svg class="chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + parts.join("") + '</svg>';
  }

  function classTable(bins, n) {
    var body = bins.map(function (bin) {
      return "<tr><td>" + esc(unrounded(bin.left) + " to " + unrounded(bin.right)) + "</td><td>" +
        esc(unrounded(bin.f)) + "</td><td>" + share(bin.f, n, false) + "</td></tr>";
    }).join("");
    return '<div class="wrap"><table><thead><tr><th>Bar</th><th>Frequency</th><th>Relative</th></tr></thead><tbody>' +
      body + "</tbody></table></div>";
  }

  function percentile(sorted, k) {
    var n = sorted.length;
    var i = (k * (n + 1)) / 100;
    if (Math.abs(i - Math.round(i)) < 1e-8) i = Math.round(i);
    if (!isFinite(k)) return "Enter a percentile from 0 to 100.";
    var text = "i = (" + unrounded(k) + " / 100) × (" + n + " + 1) = " + unrounded(i) + ". ";
    if (i < 1 || i > n) return text + "That position is outside this list.";
    if (Math.abs(i - Math.round(i)) < 1e-9) {
      var pos = Math.round(i);
      return text + "Position " + pos + " is " + unrounded(sorted[pos - 1]) + ".";
    }
    var down = Math.floor(i);
    var up = Math.ceil(i);
    var value = (sorted[down - 1] + sorted[up - 1]) / 2;
    return text + "Average positions " + down + " and " + up + ", " +
      unrounded(sorted[down - 1]) + " and " + unrounded(sorted[up - 1]) +
      ". The percentile is " + unrounded(value) + ".";
  }

  function needsNumbers(name) {
    if (shape === "three") {
      return '<p class="hint">A start and an end are not one value. The frequency table and the histogram can use these bars. ' +
        name + " needs each number.</p>";
    }
    return '<p class="hint">' + name + " needs numbers.</p>";
  }

  function givenHistogram(groups) {
    return {
      bins: groups.map(function (g, i) {
        return {
          label: unrounded(g.left),
          edge: true,
          rightLabel: i === groups.length - 1 ? unrounded(g.right) : "",
          f: g.f,
          left: g.left,
          right: g.right
        };
      }),
      note: "Each line is one bar. The bars touch when the end of one line is the start of the next."
    };
  }

  function render() {
    document.getElementById("opt-bars").hidden = pick !== "hist" || shape === "three";
    document.getElementById("opt-k").hidden = pick !== "sd";
    document.getElementById("opt-pct").hidden = pick !== "percentile";
    if (!pick) {
      out.innerHTML = '<p class="hint">Choose what you want.</p>';
      return;
    }
    var parsed = parse(dataBox.value, shape);
    if (parsed.empty) {
      out.innerHTML = '<p class="hint">Paste the data first.</p>';
      return;
    }
    if (parsed.error) {
      out.innerHTML = '<p class="hint">' + esc(parsed.error) + "</p>";
      return;
    }
    var groups = groupsOf(parsed.rows, parsed.numeric);
    var html = "";

    if (pick === "table") {
      var wholeCounts = groups.every(function (g) { return Math.abs(g.f - Math.round(g.f)) < 1e-9; });
      html = "<h2>Frequency table</h2>" + table(groups, parsed.n, parsed.headers);
      html += wholeCounts
        ? '<p class="hint">Relative frequency is the count divided by ' + parsed.n + ". The last cumulative entry is 1.</p>"
        : '<p class="hint">Each height is divided by ' + esc(unrounded(parsed.n)) + ", the total of the heights.</p>";
    } else if (pick === "bar") {
      html = "<h2>Bar graph</h2>" + chartSvg(groups, false);
      html += shape === "three"
        ? '<p class="hint">The bars stay apart. These intervals share edges, so a histogram is the picture that lets them touch.</p>'
        : '<p class="hint">The bars stay apart. Each bar is one category.</p>';
    } else if (pick === "hist") {
      if (parsed.grouped) {
        var given = givenHistogram(groups);
        html = "<h2>Histogram</h2>" + chartSvg(given.bins, true) + '<p class="hint">' + esc(given.note) + "</p>";
      } else if (!parsed.numeric) html = needsNumbers("A histogram");
      else {
        var hist = planHistogram(summarize(parsed.rows).sorted, parsed.places, barsBox.value.trim());
        html = hist.error
          ? '<p class="hint">' + esc(hist.error) + "</p>"
          : "<h2>Histogram</h2>" + chartSvg(hist.bins, true) + '<p class="hint">' + esc(hist.note) + "</p>" + classTable(hist.bins, parsed.n);
      }
    } else if (pick === "center") {
      if (parsed.grouped) {
        html = needsNumbers("The mean");
      } else {
      var mode = modes(groups);
      html = "<h2>Center</h2><div class=\"stats\">";
      if (parsed.numeric) {
        var stats = summarize(parsed.rows);
        var places = parsed.places + 1;
        html += stat("Mean", stats.mean, places) + stat("Median", stats.median, places);
      }
      html += '<div class="stat"><p class="k">Mode</p><p class="v">' + esc(mode.text) + '</p><p class="r">' + esc(mode.note) + "</p></div></div>";
      html += parsed.numeric
        ? '<p class="hint">The mean uses every value. The median is the middle of the ordered list.</p>'
        : '<p class="hint">The mode is the category that appears most often. A mean needs numbers.</p>';
      }
    } else if (pick === "quartiles") {
      if (!parsed.numeric) html = needsNumbers("Quartiles");
      else {
        var q = summarize(parsed.rows);
        var qp = parsed.places + 1;
        var five = [q.min, q.q1, q.median, q.q3, q.max].map(unrounded).join(" · ");
        var low = q.iqr === null ? null : q.q1 - 1.5 * q.iqr;
        var high = q.iqr === null ? null : q.q3 + 1.5 * q.iqr;
        var outliers = [];
        if (low !== null) q.sorted.forEach(function (x) {
          if (x < low - 1e-9 || x > high + 1e-9) outliers.push(unrounded(x));
        });
        html = "<h2>Quartiles</h2><div class=\"stats\">" +
          '<div class="stat wide"><p class="k">Five numbers</p><p class="v">' + esc(five) +
          '</p><p class="r">Minimum, Q1, median, Q3, maximum.</p></div>' +
          stat("IQR", q.iqr, qp) +
          '<div class="stat"><p class="k">Potential outliers</p><p class="v">' +
          (outliers.length ? esc(outliers.join(", ")) : "None") + "</p><p class=\"r\">Outside Q1 − 1.5 × IQR and Q3 + 1.5 × IQR.</p></div></div>";
        html += '<p class="hint">Q1 and Q3 are the medians of the two halves.</p>';
      }
    } else if (pick === "sd") {
      if (!parsed.numeric) html = needsNumbers("The standard deviation");
      else {
        var s = summarize(parsed.rows);
        var sp = parsed.places + 1;
        html = "<h2>Standard deviation</h2><div class=\"stats\">" +
          stat('<span class="plain">Sx</span> · sample', s.s, sp, s.s === null ? "Needs at least two values" : "Rounded " + rounded(s.s, sp) + ". For a sample, read this one.") +
          stat('<span class="plain">σx</span> · population', s.sigma, sp, "Rounded " + rounded(s.sigma, sp) + ".") +
          "</div>";
        var kRaw = kBox.value.trim().replace(/\u2212/g, "-");
        if (kRaw && s.s !== null && isFinite(Number(kRaw))) {
          var k = Number(kRaw);
          var away = s.mean + k * s.s;
          var sign = k < 0 ? "−" : "+";
          html += '<p class="ordered">' + esc(unrounded(s.mean) + " " + sign + " (" + unrounded(Math.abs(k)) + ")(" +
            unrounded(s.s) + ") = " + unrounded(away) + ". Rounded " + rounded(away, sp) + ".") + "</p>";
        }
      }
    } else if (pick === "percentile") {
      if (!parsed.numeric) html = needsNumbers("A percentile");
      else {
        var pctRaw = pctBox.value.trim().replace(/\u2212/g, "-");
        html = "<h2>Percentile</h2>";
        html += pctRaw
          ? '<p class="ordered">' + esc(percentile(summarize(parsed.rows).sorted, Number(pctRaw))) + "</p>"
          : '<p class="hint">Type a percentile, such as 70.</p>';
      }
    }
    out.innerHTML = html;
  }

  document.getElementById("shapes").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    shape = button.getAttribute("data-shape");
    Array.prototype.forEach.call(document.querySelectorAll("#shapes button"), function (el) {
      el.setAttribute("aria-pressed", el === button ? "true" : "false");
    });
    shapeHint.textContent = shapeText[shape];
    dataBox.placeholder = shapePlaceholder[shape];
    render();
  });
  document.getElementById("wants").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    pick = button.getAttribute("data-pick");
    Array.prototype.forEach.call(document.querySelectorAll("#wants button"), function (el) {
      el.setAttribute("aria-pressed", el === button ? "true" : "false");
    });
    render();
  });
  dataBox.addEventListener("input", render);
  pctBox.addEventListener("input", render);
  kBox.addEventListener("input", render);
  barsBox.addEventListener("input", render);
  render();
}());
</script>
</body>
</html>
